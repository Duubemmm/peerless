name: Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: test-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }} .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/peerless
            NEW_SHA=${{ github.sha }}

            # Save current running SHA before touching anything, for rollback
            CURRENT_SHA=$(grep -oP '(?<=peerless:)[a-f0-9]+' compose.yml || echo "none")
            echo "$CURRENT_SHA" > PREVIOUS_VERSION

            # Deploy new version
            sed -i "s|image: ghcr.io/duubemmm/peerless:.*|image: ghcr.io/duubemmm/peerless:${NEW_SHA}|" compose.yml
            docker compose pull
            docker compose up -d
            sleep 5

            if curl -f http://localhost:3000/ready; then
              echo "Deployment successful: ${NEW_SHA}"
              echo "$NEW_SHA" > CURRENT_VERSION
            else
              echo "Health check failed. Rolling back to ${CURRENT_SHA}"
              sed -i "s|image: ghcr.io/duubemmm/peerless:.*|image: ghcr.io/duubemmm/peerless:${CURRENT_SHA}|" compose.yml
              docker compose pull
              docker compose up -d
              sleep 5
              if curl -f http://localhost:3000/ready; then
                echo "Rollback successful: restored ${CURRENT_SHA}"
              else
                echo "Rollback also failed. Manual intervention required."
                exit 1
              fi
              exit 1
            fi